apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudsync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Malisha27/cloudsync-gitops.git
    targetRevision: main
    path: apps/cloudsync
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudsync
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true